<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل PDF إلى صور - PDF Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Cairo', sans-serif; background-color: #f3f4f6; } </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>
</head>
<body class="min-h-screen flex flex-col justify-between text-gray-800">
    <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <a href="../index.html" class="flex items-center gap-2 text-gray-600 hover:text-rose-600 font-bold transition-colors text-sm">
                <i class="fa-solid fa-arrow-right"></i><span>العودة للرئيسية</span>
            </a>
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-rose-600 rounded-xl flex items-center justify-center text-white text-lg shadow-md">
                    <i class="fa-solid fa-images"></i>
                </div>
                <span class="text-lg font-extrabold text-gray-900">تحويل PDF إلى صور</span>
            </div>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-12 w-full">
        <div class="text-center mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 mb-2">استخراج صفحات PDF كصور PNG</h1>
            <p class="text-gray-600 text-sm">حول كل صفحة من ملف الـ PDF إلى صورة بجودة عالية.</p>
        </div>

        <div onclick="document.getElementById('fileInput').click()" class="border-2 border-dashed border-gray-300 hover:border-rose-500 bg-white rounded-2xl p-10 text-center cursor-pointer transition-all shadow-sm hover:shadow-md group mb-6">
            <div class="w-16 h-16 rounded-2xl bg-rose-50 text-rose-600 flex items-center justify-center text-2xl mx-auto mb-4 group-hover:scale-105 transition-transform">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h3 class="font-bold text-gray-800 text-base mb-1">اختر ملف PDF</h3>
            <p class="text-xs text-gray-400">اسحب وأفلت الملف هنا</p>
            <input type="file" id="fileInput" accept="application/pdf" class="hidden">
        </div>

        <div id="fileInfo" class="mb-6"></div>

        <button id="processBtn" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-4 px-6 rounded-xl shadow-lg shadow-rose-600/20 transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2 text-sm" disabled>
            <i class="fa-solid fa-images text-lg"></i>
            <span>تحويل لصور الآن</span>
        </button>

        <div id="imagesContainer" class="grid grid-cols-2 sm:grid-cols-3 gap-4 mt-6"></div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 text-center text-xs text-gray-500">
        <p>جميع الحقوق محفوظة © 2026 - PDF Master</p>
    </footer>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const processBtn = document.getElementById('processBtn');
        const imagesContainer = document.getElementById('imagesContainer');
        let selectedFile = null;

        fileInput.addEventListener('change', (e) => {
            selectedFile = e.target.files[0];
            if (selectedFile) {
                processBtn.removeAttribute('disabled');
                fileInfo.innerHTML = `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 flex items-center justify-between text-sm shadow-sm">
                        <div class="flex items-center gap-3 truncate">
                            <i class="fa-solid fa-file-pdf text-rose-600 text-lg"></i>
                            <div class="truncate"><h4 class="font-bold text-gray-800 truncate">${selectedFile.name}</h4><span class="text-xs text-gray-400">${Math.round(selectedFile.size / 1024)} KB</span></div>
                        </div>
                        <button onclick="clearFile()" class="w-9 h-9 rounded-lg bg-red-50 text-red-600 hover:bg-red-100 flex items-center justify-center"><i class="fa-solid fa-trash-can text-sm"></i></button>
                    </div>`;
            }
        });

        window.clearFile = function() {
            selectedFile = null;
            fileInput.value = '';
            fileInfo.innerHTML = '';
            imagesContainer.innerHTML = '';
            processBtn.setAttribute('disabled', 'true');
        }

        processBtn.addEventListener('click', async () => {
            if (!selectedFile) return;
            processBtn.setAttribute('disabled', 'true');
            processBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i><span>جاري التصدير للصور...</span>';
            imagesContainer.innerHTML = '';

            try {
                const arrayBuffer = await selectedFile.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                
                for (let i = 1; i <= pdf.numPages; i++) {
                    const page = await pdf.getPage(i);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imageUrl = canvas.toDataURL('image/png');

                    const card = document.createElement('div');
                    card.className = 'bg-white border border-gray-200 rounded-xl p-3 text-center shadow-sm';
                    card.innerHTML = `
                        <img src="${imageUrl}" class="rounded-lg mb-2 border border-gray-100 max-h-40 mx-auto object-contain">
                        <span class="text-xs text-gray-500 block mb-2">صفحة ${i}</span>
                        <a href="${imageUrl}" download="page-${i}.png" class="inline-flex items-center gap-1 bg-rose-50 text-rose-600 hover:bg-rose-100 px-3 py-1.5 rounded-lg text-xs font-bold transition-colors">
                            <i class="fa-solid fa-download"></i><span>تحميل</span>
                        </a>`;
                    imagesContainer.appendChild(card);
                }
                processBtn.innerHTML = '<i class="fa-solid fa-check"></i><span>تم استخراج جميع الصور</span>';
            } catch (err) {
                alert('حدث خطأ أثناء تحويل الصفحات.');
                processBtn.removeAttribute('disabled');
                processBtn.innerHTML = '<i class="fa-solid fa-images text-lg"></i><span>تحويل لصور الآن</span>';
            }
        });
    </script>
</body>
</html>
